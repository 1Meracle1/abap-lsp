name = "ABAP"
grammar = "abap"
path_suffixes = ["abap"]
line_comments = ["\" "]
tab_size = 2
hard_tabs = false
word_characters = ["_"]
# Selector punctuation is advertised by the language server as trigger characters.
# Do not treat it as query text, or Zed filters selector member completions by
# receiver text such as `lo_inst->`.
completion_query_characters = []

brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "|", end = "|", close = true, newline = false, not_in = ["string", "comment"] },
]

[overrides.string]
completion_query_characters = []

[overrides.field_symbol]
word_characters = ["_", "<", ">"]
