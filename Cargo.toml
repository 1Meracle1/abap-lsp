[workspace]
members = ["crates/*"]
default-members = ["crates/abap_lsp_server"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.86"
version = "0.1.0"

[workspace.dependencies]
crossbeam-channel = "0.5"
lsp-types = "0.97"
parking_lot = "0.12"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
